name: CI/CD to EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  APP_DIR: ${{ secrets.EC2_APP_DIR }}
  BACKEND_SERVICE_NAME: ${{ secrets.BACKEND_SERVICE_NAME }}
  FRONTEND_DEPLOY_DIR: ${{ secrets.FRONTEND_DEPLOY_DIR }}
  DEPLOY_COMMIT_SHA: ${{ github.sha }}
  DEPLOY_REF_NAME: ${{ github.ref_name }}
  PYTHON_VENV_PATH: ${{ secrets.PYTHON_VENV_PATH }}
  DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
  DJANGO_DEBUG: ${{ secrets.DJANGO_DEBUG }}
  DJANGO_ALLOWED_HOSTS: ${{ secrets.DJANGO_ALLOWED_HOSTS }}
  CORS_ALLOWED_ORIGINS: ${{ secrets.CORS_ALLOWED_ORIGINS }}
  CSRF_TRUSTED_ORIGINS: ${{ secrets.CSRF_TRUSTED_ORIGINS }}
  CORS_ALLOW_ALL_ORIGINS: ${{ secrets.CORS_ALLOW_ALL_ORIGINS }}
  CORS_ALLOW_CREDENTIALS: ${{ secrets.CORS_ALLOW_CREDENTIALS }}
  DB_NAME: ${{ secrets.DB_NAME }}
  DB_USER: ${{ secrets.DB_USER }}
  DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
  DB_HOST: ${{ secrets.DB_HOST }}
  DB_PORT: ${{ secrets.DB_PORT }}
  DB_CONNECT_TIMEOUT: ${{ secrets.DB_CONNECT_TIMEOUT }}
  DB_CONN_MAX_AGE: ${{ secrets.DB_CONN_MAX_AGE }}
  USE_S3: ${{ secrets.USE_S3 }}
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
  AWS_STORAGE_BUCKET_NAME: ${{ secrets.AWS_STORAGE_BUCKET_NAME }}
  AWS_S3_REGION_NAME: ${{ secrets.AWS_S3_REGION_NAME }}
  AWS_S3_CUSTOM_DOMAIN: ${{ secrets.AWS_S3_CUSTOM_DOMAIN }}
  SNS_NOTIFICATIONS_ENABLED: ${{ secrets.SNS_NOTIFICATIONS_ENABLED }}
  SNS_USER_TOPIC_PREFIX: ${{ secrets.SNS_USER_TOPIC_PREFIX }}
  SNS_BROADCAST_TOPIC_ARN: ${{ secrets.SNS_BROADCAST_TOPIC_ARN }}
  AWS_REGION: ${{ secrets.AWS_REGION }}
  FARE_ENGINE_VERSION: ${{ secrets.FARE_ENGINE_VERSION }}

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Frontend build
        working-directory: frontend
        run: npm run build

  deploy:
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - name: Deploy backend and frontend on EC2 over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          envs: APP_DIR,BACKEND_SERVICE_NAME,FRONTEND_DEPLOY_DIR,DEPLOY_COMMIT_SHA,DEPLOY_REF_NAME,PYTHON_VENV_PATH,DJANGO_SECRET_KEY,DJANGO_DEBUG,DJANGO_ALLOWED_HOSTS,CORS_ALLOWED_ORIGINS,CSRF_TRUSTED_ORIGINS,CORS_ALLOW_ALL_ORIGINS,CORS_ALLOW_CREDENTIALS,DB_NAME,DB_USER,DB_PASSWORD,DB_HOST,DB_PORT,DB_CONNECT_TIMEOUT,DB_CONN_MAX_AGE,USE_S3,AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY,AWS_SESSION_TOKEN,AWS_STORAGE_BUCKET_NAME,AWS_S3_REGION_NAME,AWS_S3_CUSTOM_DOMAIN,SNS_NOTIFICATIONS_ENABLED,SNS_USER_TOPIC_PREFIX,SNS_BROADCAST_TOPIC_ARN,AWS_REGION,FARE_ENGINE_VERSION
          script: |
            set -euxo pipefail

            if [ -z "${APP_DIR}" ]; then
              echo "EC2_APP_DIR secret is required"
              exit 1
            fi
            if [ -z "${BACKEND_SERVICE_NAME}" ]; then
              echo "BACKEND_SERVICE_NAME secret is required"
              exit 1
            fi

            echo "Syncing repository to origin/main..."
            cd "${APP_DIR}"
            git fetch --all --prune
            git reset --hard origin/main
            echo "Repository now at commit: $(git rev-parse HEAD)"
            echo "Workflow commit: ${DEPLOY_COMMIT_SHA:-unknown} on ref ${DEPLOY_REF_NAME:-unknown}"

            echo "Deploying backend..."
            cd "${APP_DIR}/backend/smart_rental"

            if ! command -v python3 >/dev/null 2>&1; then
              echo "python3 is required on EC2 for backend deploy."
              exit 1
            fi

            echo "Python runtime: $(python3 --version)"
            if python3 -m pip --version >/dev/null 2>&1; then
              echo "pip is available for python3"
            else
              echo "python3 pip is missing. Install python3-pip on EC2 and rerun deploy."
              exit 1
            fi

            ENV_FILE="${APP_DIR}/backend/smart_rental/.env"
            touch "${ENV_FILE}"

            upsert_env() {
              key="$1"
              value="${2:-}"

              tmp_file="$(mktemp)"
              grep -v "^${key}=" "${ENV_FILE}" > "${tmp_file}" || true
              printf "%s=%s\n" "${key}" "${value}" >> "${tmp_file}"
              mv "${tmp_file}" "${ENV_FILE}"
            }

            # Keep .env in sync with GitHub secrets so Django settings can read S3 config.
            upsert_env "DJANGO_SECRET_KEY" "${DJANGO_SECRET_KEY:-}"
            upsert_env "DJANGO_DEBUG" "${DJANGO_DEBUG:-}"
            upsert_env "DJANGO_ALLOWED_HOSTS" "${DJANGO_ALLOWED_HOSTS:-}"
            upsert_env "CORS_ALLOWED_ORIGINS" "${CORS_ALLOWED_ORIGINS:-}"
            upsert_env "CSRF_TRUSTED_ORIGINS" "${CSRF_TRUSTED_ORIGINS:-}"
            upsert_env "CORS_ALLOW_ALL_ORIGINS" "${CORS_ALLOW_ALL_ORIGINS:-}"
            upsert_env "CORS_ALLOW_CREDENTIALS" "${CORS_ALLOW_CREDENTIALS:-}"
            upsert_env "DB_NAME" "${DB_NAME:-}"
            upsert_env "DB_USER" "${DB_USER:-}"
            upsert_env "DB_PASSWORD" "${DB_PASSWORD:-}"
            upsert_env "DB_HOST" "${DB_HOST:-}"
            upsert_env "DB_PORT" "${DB_PORT:-}"
            upsert_env "DB_CONNECT_TIMEOUT" "${DB_CONNECT_TIMEOUT:-5}"
            upsert_env "DB_CONN_MAX_AGE" "${DB_CONN_MAX_AGE:-60}"

            upsert_env "USE_S3" "${USE_S3:-}"
            upsert_env "AWS_ACCESS_KEY_ID" "${AWS_ACCESS_KEY_ID:-}"
            upsert_env "AWS_SECRET_ACCESS_KEY" "${AWS_SECRET_ACCESS_KEY:-}"
            upsert_env "AWS_SESSION_TOKEN" "${AWS_SESSION_TOKEN:-}"
            upsert_env "AWS_STORAGE_BUCKET_NAME" "${AWS_STORAGE_BUCKET_NAME:-}"
            upsert_env "AWS_S3_REGION_NAME" "${AWS_S3_REGION_NAME:-}"
            upsert_env "AWS_S3_CUSTOM_DOMAIN" "${AWS_S3_CUSTOM_DOMAIN:-}"
            upsert_env "SNS_NOTIFICATIONS_ENABLED" "${SNS_NOTIFICATIONS_ENABLED:-false}"
            upsert_env "SNS_USER_TOPIC_PREFIX" "${SNS_USER_TOPIC_PREFIX:-smart-rental-user}"
            upsert_env "SNS_BROADCAST_TOPIC_ARN" "${SNS_BROADCAST_TOPIC_ARN:-}"
            upsert_env "AWS_REGION" "${AWS_REGION:-${AWS_S3_REGION_NAME:-}}"
            upsert_env "FARE_ENGINE_VERSION" "${FARE_ENGINE_VERSION:-0.1.0}"

            if [ -z "${DJANGO_SECRET_KEY:-}" ]; then
              echo "DJANGO_SECRET_KEY secret is required"
              exit 1
            fi

            if [ -z "${DB_NAME:-}" ] || [ -z "${DB_USER:-}" ] || [ -z "${DB_PASSWORD:-}" ] || [ -z "${DB_HOST:-}" ] || [ -z "${DB_PORT:-}" ]; then
              echo "Database secrets are incomplete. Provide DB_NAME, DB_USER, DB_PASSWORD, DB_HOST, and DB_PORT."
              exit 1
            fi

            if [ "${USE_S3:-}" = "1" ] || [ "${USE_S3:-}" = "true" ]; then
              if [ -z "${AWS_ACCESS_KEY_ID:-}" ] || [ -z "${AWS_SECRET_ACCESS_KEY:-}" ] || [ -z "${AWS_STORAGE_BUCKET_NAME:-}" ] || [ -z "${AWS_S3_REGION_NAME:-}" ]; then
                echo "USE_S3 is enabled, but required AWS secrets are missing."
                exit 1
              fi
            fi

            DEPLOY_VENV_PATH="${APP_DIR}/backend/smart_rental/.venv"
            if [ -n "${PYTHON_VENV_PATH:-}" ]; then
              DEPLOY_VENV_PATH="${PYTHON_VENV_PATH}"
            fi

            if [ ! -f "${DEPLOY_VENV_PATH}/bin/activate" ]; then
              echo "Virtualenv not found at ${DEPLOY_VENV_PATH}, creating it now..."
              if ! python3 -m venv "${DEPLOY_VENV_PATH}"; then
                echo "python3 -m venv failed; trying virtualenv fallback..."
                python3 -m pip install --user virtualenv
                python3 -m virtualenv "${DEPLOY_VENV_PATH}"
              fi
            fi

            if [ ! -f "${DEPLOY_VENV_PATH}/bin/activate" ]; then
              echo "Virtualenv activation script not found at ${DEPLOY_VENV_PATH}/bin/activate"
              exit 1
            fi

            # shellcheck disable=SC1090
            source "${DEPLOY_VENV_PATH}/bin/activate"
            echo "Using python: $(which python)"
            echo "Using pip: $(which pip)"

            python -m pip install --upgrade pip

            if [ -f requirements.txt ]; then
              python -m pip install -r requirements.txt
            else
              echo "requirements.txt not found in backend/smart_rental; cannot install Django deps."
              exit 1
            fi

            FARE_ENGINE_VERSION="${FARE_ENGINE_VERSION:-0.1.0}"
            echo "Installing carpool-fare-engine==${FARE_ENGINE_VERSION} from PyPI"
            python -m pip install --upgrade "carpool-fare-engine==${FARE_ENGINE_VERSION}"

            echo "Running Django migration checks..."
            python -c "import django; print('Django import OK:', django.get_version())"
            python -c "import carpool_fare_engine; print('Custom fare package import OK:', carpool_fare_engine.__file__)"

            python manage.py migrate --noinput

            # Not required for API-only backend, but harmless if staticfiles app is configured.
            python manage.py collectstatic --noinput || true

            sudo systemctl restart "${BACKEND_SERVICE_NAME}"
            sudo systemctl is-active --quiet "${BACKEND_SERVICE_NAME}"

            echo "Deploying frontend..."
            cd "${APP_DIR}/frontend"

            if ! command -v npm >/dev/null 2>&1; then
              echo "npm is not installed on EC2; installing nodejs and npm..."
              sudo apt-get update
              sudo apt-get install -y nodejs npm
            fi

            echo "Node runtime: $(node --version)"
            echo "npm runtime: $(npm --version)"

            npm ci
            npm run build

            if [ ! -f dist/index.html ]; then
              echo "Frontend build output missing dist/index.html"
              exit 1
            fi

            # Normalize deploy dir from secrets to avoid hidden CR/LF or trailing spaces.
            FRONTEND_DEPLOY_DIR="$(printf '%s' "${FRONTEND_DEPLOY_DIR}" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"

            if [ -z "${FRONTEND_DEPLOY_DIR}" ]; then
              echo "FRONTEND_DEPLOY_DIR is empty; cannot publish frontend."
              exit 1
            fi

            echo "Publishing frontend dist to ${FRONTEND_DEPLOY_DIR}"
            sudo mkdir -p "${FRONTEND_DEPLOY_DIR}"
            sudo rsync -av --delete dist/ "${FRONTEND_DEPLOY_DIR}/"

            # Write deployment marker for quick verification on server.
            DEPLOYED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            printf '{"commit":"%s","ref":"%s","deployed_at":"%s"}\n' \
              "${DEPLOY_COMMIT_SHA:-unknown}" \
              "${DEPLOY_REF_NAME:-unknown}" \
              "${DEPLOYED_AT}" \
              | sudo tee "${FRONTEND_DEPLOY_DIR}/deploy-meta.json" >/dev/null

            if [ ! -f "${FRONTEND_DEPLOY_DIR}/index.html" ]; then
              echo "Frontend deploy validation failed: index.html not found in ${FRONTEND_DEPLOY_DIR}"
              exit 1
            fi

            LOCAL_INDEX_SUM="$(sha256sum dist/index.html | awk '{print $1}' | tr -cd '0-9a-fA-F' | head -c 64)"
            DEPLOYED_INDEX_SUM="$(sudo sha256sum "${FRONTEND_DEPLOY_DIR}/index.html" | awk '{print $1}' | tr -cd '0-9a-fA-F' | head -c 64)"

            if [ "${#LOCAL_INDEX_SUM}" -ne 64 ] || [ "${#DEPLOYED_INDEX_SUM}" -ne 64 ]; then
              echo "Frontend deploy validation failed: could not parse 64-char checksums."
              exit 1
            fi

            echo "Local index checksum: ${LOCAL_INDEX_SUM}"
            echo "Deployed index checksum: ${DEPLOYED_INDEX_SUM}"
            if [ "${LOCAL_INDEX_SUM}" != "${DEPLOYED_INDEX_SUM}" ]; then
              echo "Frontend deploy validation failed: checksums do not match."
              exit 1
            fi

            echo "Deployment finished."
