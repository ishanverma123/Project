[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "carpool-fare-engine"
version = "0.6.0"
description = "Dynamic fare calculation engine for carpool platforms"
readme = "README.md"
requires-python = ">=3.9"
authors = [
  { name = "Smart Rental Team" }
]
license = { text = "MIT" }
keywords = ["carpool", "pricing", "fare", "dynamic-pricing"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
